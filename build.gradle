plugins { id 'base' }
allprojects {
    group = 'com.replaymod'
    version = rootProject.mod_version
    repositories { mavenCentral() }
}
tasks.register('buildAll') { dependsOn subprojects.collect { "${it.path}:build" } }
tasks.register('testAllVersions') { dependsOn subprojects.collect { "${it.path}:test" } }
