plugins { id 'base' }
allprojects {
    group = 'com.replaymod'
    version = rootProject.mod_version
    repositories { mavenCentral() }
}
tasks.register('buildAll') { dependsOn subprojects.collect { "${it.path}:build" } }
tasks.register('testAllVersions') { dependsOn subprojects.collect { "${it.path}:test" } }

// Older engine branches have incompatible Loom/RFG plugin versions. Evaluate
// each in its own build, with its own Minecraft/version properties.
def standaloneLanes = ['legacy-1.7.10', 'forge-1.18.2', 'forge-1.19.2',
                       'neoforge-1.20.6', 'neoforge-1.21.1', 'neoforge-1.21.8']
standaloneLanes.each { lane ->
    ['build', 'test'].each { action ->
        def taskName = "${action}-${lane}"
        tasks.register(taskName, GradleBuild) {
            dir = file(lane)
            tasks = [action]
        }
        tasks.named(action == 'build' ? 'buildAll' : 'testAllVersions') { dependsOn taskName }
    }
}
