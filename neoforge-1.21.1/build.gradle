plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

version = project.mod_version
group = project.maven_group

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

loom {
    runs {
        it.configureEach {
            vmArgs("-Xmx8G", "-XX:+UseZGC")
        }
    }

    silentMojangMappingsLicense()
}

configurations {
    bundle {
        // bundle command, to copy jar contents with the shadow plugin
        canBeResolved = true
        canBeConsumed = false
    }
}

processResources {
    inputs.property "version", project.version
    archivesBaseName = "agenticreplay-${project.minecraft_version}"
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://maven.neoforged.net/releases" }
    maven { url "https://jitpack.io" }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.blamejared.com" }
}

shadowJar {
    configurations = [
            project.configurations.bundle
    ]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

dependencies {

    mappings loom.layered() {
        it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:1.21+build.4")
    }
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    //mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    bundle(files('libs/ReplayStudio-master-SNAPSHOT-slim.jar'))
    minecraftRuntimeLibraries(implementation(files('libs/ReplayStudio-master-SNAPSHOT-slim.jar')))
    include(implementation("com.github.viaversion:opennbt:0a02214"))
    minecraftRuntimeLibraries(implementation("com.github.viaversion:opennbt:0a02214"))
    include(implementation("com.github.ReplayMod:lwjgl-utils:27dcd66"))
    minecraftRuntimeLibraries("com.github.ReplayMod:lwjgl-utils:27dcd66")
    include(implementation("com.github.javagl.JglTF:jgltf-model:3af6de4"))
    include(implementation("com.github.javagl.JglTF:jgltf-impl-v1:3af6de4"))
    include(implementation("com.github.javagl.JglTF:jgltf-impl-v2:3af6de4"))
    include(implementation("com.fasterxml.jackson.core:jackson-databind:2.20.0"))
    include(implementation("com.fasterxml.jackson.core:jackson-core:2.20.0"))
    include(implementation("com.fasterxml.jackson.core:jackson-annotations:2.20"))
    include(implementation("com.github.ReplayMod.JavaBlend:2.79.0:a0696f8"))
    include(implementation("org.aspectj:aspectjrt:1.8.2"))
    include(implementation("org.lwjgl:lwjgl-tinyexr:3.3.1"))
    bundle("org.lwjgl:lwjgl-tinyexr:3.3.1:natives-windows") {
        transitive = false
    }
    bundle("org.lwjgl:lwjgl-tinyexr:3.3.1:natives-linux") {
        transitive = false
    }
    bundle("org.lwjgl:lwjgl-tinyexr:3.3.1:natives-macos") {
        transitive = false
    }
    include(implementation('com.googlecode.mp4parser:isoparser:1.1.7'))
    include(implementation('org.apache.commons:commons-exec:1.3'))
    minecraftRuntimeLibraries(implementation('org.apache.commons:commons-exec:1.3'))
    include(implementation('com.google.apis:google-api-services-youtube:v3-rev178-1.22.0'))
    include(implementation('com.google.api-client:google-api-client-gson:1.20.0'))
    include(implementation('com.google.api-client:google-api-client-java6:1.20.0'))
    include(implementation('com.google.oauth-client:google-oauth-client-jetty:1.20.0'))

    testImplementation 'junit:junit:4.11'

    modCompileOnly("maven.modrinth:iris:1.8.6+1.21.1-neoforge")
    //modRuntimeOnly("maven.modrinth:iris:1.8.6+1.21.1-neoforge")

    modCompileOnly("org.embeddedt:embeddium-1.21:1.0.8-beta.367+mc1.21")
    modRuntimeOnly("org.embeddedt:embeddium-1.21:1.0.8-beta.367+mc1.21")

    modCompileOnly("maven.modrinth:sodium:mc1.21.1-0.6.5-neoforge")
    //modRuntimeOnly("maven.modrinth:sodium:mc1.21.1-0.6.5-neoforge")
}

tasks.register('verifyReplayLibrary') {
    def library = file('libs/ReplayStudio-master-SNAPSHOT-slim.jar')
    inputs.file(library)
    doLast {
        def checksum = java.security.MessageDigest.getInstance('SHA-256').digest(library.bytes).encodeHex().toString()
        if (checksum != 'e034b0a39cc906ba38c401a13c09bf6fca5512ecb658428380994f71b7d48250')
            throw new GradleException('Pinned ReplayStudio input checksum mismatch')
    }
}
tasks.named('compileJava') { dependsOn 'verifyReplayLibrary' }

// Preserve upstream and agent-code notices in binary and source distributions.
tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    from('../legacy-1.7.10/LICENSE.md') { into 'META-INF'; rename { 'LICENSE-upstream-replaymod.txt' } }
    from('../LICENSE.txt') { into 'META-INF'; rename { 'LICENSE-agent-code.txt' } }
}
java { withSourcesJar() }
