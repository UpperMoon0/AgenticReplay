name: Build Forge 1.7.10
on:
  push:
    branches: ['1.20.1', 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-1710-${{ github.ref }}
  cancel-in-progress: true
jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify official historical runtime
        run: python3 legacy-1.7.10/scripts/prepare_replaymod.py
      - name: Build and test Java 8 legacy client
        run: ./gradlew -p legacy-1.7.10 build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticReplay-Forge-1.7.10
          path: |
            legacy-1.7.10/build/libs/agenticreplay-1.7.10-*.jar
            !legacy-1.7.10/build/libs/*-dev*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-Forge-1.7.10
          path: legacy-1.7.10/build/test-results/test/
