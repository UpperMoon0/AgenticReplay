name: Version branch engines
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: version-engines-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [forge-1.18.2, forge-1.19.2, neoforge-1.20.6, neoforge-1.21.1, neoforge-1.21.8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build retained engine
        run: chmod +x gradlew && ./gradlew -p ${{ matrix.module }} build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticReplay-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            !${{ matrix.module }}/build/libs/*-dev*.jar
            !${{ matrix.module }}/build/libs/*-sources.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-${{ matrix.module }}
          path: ${{ matrix.module }}/build/test-results/test/
          if-no-files-found: ignore
