name: Build
on:
  push:
    branches: ['1.20.1', 'feat/**', 'codex/**']
  pull_request:
concurrency:
  group: agenticreplay-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: common
            java: '17'
          - module: forge-1.20.1
            java: '17'
          - module: neoforge-26.1.2
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test ${{ matrix.module }}
        run: chmod +x gradlew && ./gradlew :${{ matrix.module }}:build --console=plain
      - name: Verify NeoForge packaging
        if: matrix.module == 'neoforge-26.1.2'
        run: python3 scripts/check_mod_jar.py neoforge-26.1.2/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticReplay-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
            !${{ matrix.module }}/build/libs/*-dev*.jar
            !${{ matrix.module }}/build/libs/*-sources.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-${{ matrix.module }}
          path: ${{ matrix.module }}/build/test-results/test/
