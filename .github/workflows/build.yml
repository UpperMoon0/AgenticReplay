name: Build

on:
  push:
    branches: ['1.20.1', 'feat/**', 'codex/**']
  pull_request:

concurrency:
  group: agenticreplay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Forge client
        run: chmod +x gradlew && ./gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: AgenticReplay-Forge-1.20.1
          path: |
            build/libs/agenticreplay-1.20.1-*.jar
            !build/libs/*-dev*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-results-Forge-1.20.1
          path: build/test-results/test/
